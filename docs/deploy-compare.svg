<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24163d"/>
      <stop offset="1" stop-color="#12162c"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2b2a"/>
      <stop offset="1" stop-color="#0f1621"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .font { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 36px; font-weight: 800; letter-spacing: 0.5px; }
      .subtitle { font-size: 18px; font-weight: 500; opacity: 0.9; }
      .panelTitle { font-size: 26px; font-weight: 800; }
      .tag { font-size: 14px; font-weight: 700; letter-spacing: 0.6px; }
      .item { font-size: 20px; font-weight: 650; }
      .muted { opacity: 0.8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>

  <g class="font">
    <text x="80" y="98" fill="#eaf2ff" class="title">部署方式对比</text>
    <text x="80" y="132" fill="#b9c7e6" class="subtitle">左：传统部署（自己维护）  /  右：Vercel 部署（平台托管）</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="70" y="170" rx="22" ry="22" width="560" height="480" fill="url(#leftGrad)" stroke="#3a2a5e" stroke-width="2"/>
    <rect x="650" y="170" rx="22" ry="22" width="560" height="480" fill="url(#rightGrad)" stroke="#1f4a46" stroke-width="2"/>
  </g>

  <g class="font">
    <g>
      <rect x="96" y="198" rx="999" ry="999" width="98" height="32" fill="#2f1b52" stroke="#5a3a93" stroke-width="1.5"/>
      <text x="145" y="220" fill="#e9ddff" text-anchor="middle" class="tag">TRADITIONAL</text>
      <text x="96" y="270" fill="#f3eaff" class="panelTitle">传统部署</text>
      <text x="96" y="302" fill="#c7b7ea" class="subtitle">买服务器 / 配环境 / 自己兜底</text>
    </g>

    <g>
      <rect x="676" y="198" rx="999" ry="999" width="76" height="32" fill="#103b37" stroke="#2fa59b" stroke-width="1.5"/>
      <text x="714" y="220" fill="#ccfffb" text-anchor="middle" class="tag">VERCEL</text>
      <text x="676" y="270" fill="#e6fffb" class="panelTitle">Vercel 部署</text>
      <text x="676" y="302" fill="#b0eae2" class="subtitle">Git 推送自动构建 / 自动上线</text>
    </g>
  </g>

  <g>
    <g transform="translate(102, 334)">
      <g opacity="0.95">
        <rect x="0" y="0" rx="14" ry="14" width="496" height="72" fill="#161a2b" stroke="#4f3a83" stroke-width="1.2"/>
        <g transform="translate(18, 16)">
          <rect x="0" y="14" width="52" height="38" rx="8" fill="#2b1b4a" stroke="#7a57c2" stroke-width="1.2"/>
          <rect x="10" y="6" width="52" height="38" rx="8" fill="#2b1b4a" stroke="#7a57c2" stroke-width="1.2" opacity="0.85"/>
          <circle cx="14" cy="33" r="3" fill="#9d7bff"/>
          <circle cx="26" cy="33" r="3" fill="#9d7bff"/>
          <circle cx="38" cy="33" r="3" fill="#9d7bff"/>
        </g>
        <text x="98" y="46" class="font item" fill="#f2eaff">买服务器 / 云主机</text>
        <text x="98" y="66" class="font subtitle muted" fill="#c7b7ea">预算、扩容、机房与地域都要自己考虑</text>
      </g>
    </g>

    <g transform="translate(102, 422)">
      <g opacity="0.95">
        <rect x="0" y="0" rx="14" ry="14" width="496" height="72" fill="#161a2b" stroke="#4f3a83" stroke-width="1.2"/>
        <g transform="translate(18, 16)">
          <rect x="0" y="0" width="60" height="40" rx="10" fill="#1d2238" stroke="#7a57c2" stroke-width="1.2"/>
          <path d="M12 12 L26 20 L12 28" fill="none" stroke="#9d7bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="34" y1="28" x2="50" y2="28" stroke="#9d7bff" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="98" y="46" class="font item" fill="#f2eaff">装 Nginx / 配反代</text>
        <text x="98" y="66" class="font subtitle muted" fill="#c7b7ea">静态资源、缓存策略、gzip/br 都要手配</text>
      </g>
    </g>

    <g transform="translate(102, 510)">
      <g opacity="0.95">
        <rect x="0" y="0" rx="14" ry="14" width="496" height="72" fill="#161a2b" stroke="#4f3a83" stroke-width="1.2"/>
        <g transform="translate(18, 16)">
          <rect x="0" y="0" width="60" height="40" rx="10" fill="#1d2238" stroke="#7a57c2" stroke-width="1.2"/>
          <circle cx="16" cy="20" r="7" fill="none" stroke="#9d7bff" stroke-width="2.5"/>
          <path d="M26 20 H48" fill="none" stroke="#9d7bff" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M48 20 l6 -6 M48 20 l6 6" fill="none" stroke="#9d7bff" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <text x="98" y="46" class="font item" fill="#f2eaff">配置 SSH / 发布脚本</text>
        <text x="98" y="66" class="font subtitle muted" fill="#c7b7ea">回滚、权限、发布窗口都要流程化</text>
      </g>
    </g>

    <g transform="translate(102, 598)">
      <g opacity="0.95">
        <rect x="0" y="0" rx="14" ry="14" width="496" height="72" fill="#161a2b" stroke="#4f3a83" stroke-width="1.2"/>
        <g transform="translate(18, 16)">
          <path d="M30 0 L54 12 V28 C54 40 44 52 30 56 C16 52 6 40 6 28 V12 Z" fill="#2b1b4a" stroke="#7a57c2" stroke-width="1.2"/>
          <path d="M18 26 L26 34 L42 18" fill="none" stroke="#9d7bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="98" y="46" class="font item" fill="#f2eaff">搞证书 / HTTPS / 续期</text>
        <text x="98" y="66" class="font subtitle muted" fill="#c7b7ea">证书、HSTS、重定向与安全头都要管</text>
      </g>
    </g>
  </g>

  <g>
    <g transform="translate(682, 334)">
      <rect x="0" y="0" rx="14" ry="14" width="496" height="92" fill="#0f1724" stroke="#2b6e68" stroke-width="1.2"/>
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="78" height="56" rx="12" fill="#0e2a28" stroke="#2fa59b" stroke-width="1.2"/>
        <text x="39" y="36" text-anchor="middle" class="font mono" fill="#ccfffb" style="font-size:16px; font-weight:800;">git push</text>
      </g>
      <text x="118" y="44" class="font item" fill="#e6fffb">推送代码到 Git 仓库</text>
      <text x="118" y="70" class="font subtitle muted" fill="#b0eae2">触发自动化流水线（无需 SSH 上线）</text>
    </g>

    <g transform="translate(682, 442)">
      <rect x="0" y="0" rx="14" ry="14" width="496" height="92" fill="#0f1724" stroke="#2b6e68" stroke-width="1.2"/>
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="78" height="56" rx="12" fill="#0e2a28" stroke="#2fa59b" stroke-width="1.2"/>
        <path d="M20 38 C20 28 28 20 38 20 C46 20 53 25 56 32 C63 32 68 37 68 44 C68 52 62 56 54 56 H30 C24 56 20 50 20 44" fill="none" stroke="#70fff2" stroke-width="3" stroke-linecap="round"/>
        <path d="M38 30 v18" fill="none" stroke="#70fff2" stroke-width="3" stroke-linecap="round"/>
        <path d="M31 39 l7 -9 l7 9" fill="none" stroke="#70fff2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="118" y="44" class="font item" fill="#e6fffb">平台自动构建与发布</text>
      <text x="118" y="70" class="font subtitle muted" fill="#b0eae2">构建产物、缓存与边缘分发自动处理</text>
    </g>

    <g transform="translate(682, 550)">
      <rect x="0" y="0" rx="14" ry="14" width="496" height="92" fill="#0f1724" stroke="#2b6e68" stroke-width="1.2"/>
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="78" height="56" rx="12" fill="#0e2a28" stroke="#2fa59b" stroke-width="1.2"/>
        <path d="M20 40 L36 26 L52 40" fill="none" stroke="#70fff2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="28" y="38" width="20" height="18" rx="5" fill="none" stroke="#70fff2" stroke-width="3"/>
      </g>
      <text x="118" y="44" class="font item" fill="#e6fffb">自动 HTTPS 与域名</text>
      <text x="118" y="70" class="font subtitle muted" fill="#b0eae2">证书签发/续期、重定向配置更省心</text>
    </g>
  </g>

  <g class="font">
    <g transform="translate(682, 650)">
      <rect x="0" y="-6" rx="14" ry="14" width="496" height="64" fill="#0f2b2a" stroke="#2fa59b" stroke-width="1.2" opacity="0.95"/>
      <text x="248" y="24" text-anchor="middle" class="item" fill="#e6fffb">结果：更少的运维，更快的迭代</text>
      <text x="248" y="46" text-anchor="middle" class="subtitle" fill="#b0eae2">把精力留给业务与体验优化</text>
    </g>
  </g>
</svg>
